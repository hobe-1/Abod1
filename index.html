<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوفية توب كبدة</title>
<meta name="theme-color" content="#772d43">
<meta name="description" content="اطلب من بوفية توب كبدة بسهولة عبر واتساب — استلام من الفرع أو من السيارة">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#160d09;--card:#26170f;--line:#4d3022;--ac:#f2c200;--ac2:#ffd23f;--tx:#fff4ea;--mu:#c9a994;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}
h1,h2,h3{font-family:'Reem Kufi',Tajawal,sans-serif;margin:0;font-weight:700}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;max-width:1000px;margin:auto}
.gear{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:8px 16px;font-size:14px}
.gear:hover{border-color:var(--ac)}
.hero{text-align:center;padding:28px 20px 48px;background:radial-gradient(120% 90% at 50% 0%,#9a3a55 0%,#772d43 45%,#4a1627 100%);border-radius:0 0 32px 32px}
.hero h1{font-size:42px;color:var(--ac2);margin-bottom:6px}
.hero p{color:#fff3e8;font-size:18px;margin-bottom:20px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:99px;font-weight:700;border:1.5px solid var(--ac);color:var(--tx);background:transparent}
.btn.p{background:var(--ac);color:#1a0b04}
.btn.p:hover{background:var(--ac2)}
section{max-width:1000px;margin:auto;padding:24px 20px}
.cat{margin-top:28px}
.cat h3{font-size:24px;color:var(--ac2);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.mi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;transition:transform .2s}
.mi:hover{border-color:var(--ac);transform:translateY(-2px)}
.mi .n{font-weight:700;font-size:17px}
.mi .v{color:var(--ac2);font-weight:700}
.add{background:var(--ac);color:#1a0b04;border:0;border-radius:99px;width:34px;height:34px;font-weight:700;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
#cartbar{position:fixed;inset-inline:16px;bottom:16px;z-index:6;display:none;justify-content:space-between;align-items:center;background:var(--ac);color:#1a0b04;border:0;border-radius:99px;padding:14px 22px;font-weight:700;font-size:17px;max-width:520px;margin:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#cartbar.on{display:flex}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:9;justify-content:center;align-items:center}
.ov.on{display:flex}
.cs{background:#26170f;border:1px solid var(--line);border-radius:24px;padding:24px;width:min(440px,92%);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
input,textarea,select{width:100%;background:#120a06;border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:10px 12px;font:inherit}
.ai-box{background:rgba(242,194,0,.1);border:1px dashed var(--ac);border-radius:14px;padding:10px;margin:8px 0;font-size:14px;color:var(--ac2)}
.capp{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none}
.capp.on{display:block}
.ch{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line);background:#21120a}
.ctabs{display:flex;gap:6px;padding:10px 14px;background:rgba(22,13,9,.95)}
.ctabs button{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:6px 14px}
.ctabs .on{background:var(--ac);color:#1a0b04;font-weight:700}
.cb{padding:14px;max-width:1000px;margin:auto}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}

/* التنسيق الخاص بالطابعة الحرارية */
@media print{
  body > *:not(#pa){display:none !important}
  #pa{display:block !important}
  .rc{width:var(--pw,72mm);margin:0 auto;color:#000;background:#fff;font-family:Tajawal,Arial,sans-serif;padding:6px;font-size:12px;line-height:1.4}
  .rh{text-align:center;border-bottom:2px dashed #000;padding-bottom:6px;margin-bottom:6px}
  .rh h2{font-size:18px;margin:0;font-weight:800}.rh b{font-size:14px;background:#000;color:#fff;display:block;padding:2px;margin:4px 0}
  .ritem{display:flex;justify-content:space-between;border-bottom:1px dotted #888;padding:4px 0}
  .rsum{border-top:2px solid #000;margin-top:6px;padding-top:4px;font-weight:700}
  .rqr{text-align:center;margin-top:8px}.rqr img{width:85px;height:85px}
  @page{margin:0;size:auto}
}
</style>
</head>
<body>

<div class="top">
  <b>بوفية توب كبدة</b>
  <div class="tr">
    <button class="gear" id="open">⚙ الإعدادات</button>
    <button class="gear" id="opcash">🧾 الكاشير</button>
  </div>
</div>

<header class="hero">
  <h1>بوفية توب كبدة</h1>
  <p>أشهى ساندوتشات الكبدة والحمسات الطازجة يومياً</p>
  <div class="btns">
    <a class="btn p" href="tel:+966503236421">اتصل الآن</a>
    <a class="btn" href="https://wa.me/966503236421" target="_blank" rel="noopener">واتساب</a>
  </div>
</header>

<section>
  <input id="q" type="search" placeholder="ابحث في قائمة الطعام…" aria-label="بحث في القائمة">
  <div id="menu"></div>
</section>

<button id="cartbar"></button>

<div id="ord" class="ov">
  <div class="cs" id="cart"></div>
</div>

<div id="capp" class="capp"></div>
<div id="pa"></div>

<div id="panel" class="ov">
  <div class="cs" id="sheet"></div>
</div>

<script>
const DEF_ITEMS = [
  {"name": "ساندوتش كبدة جبن", "price": "5", "cat": "ساندوتشات الفطور"},
  {"name": "ساندوتش كبدة", "price": "4", "cat": "ساندوتشات الفطور"},
  {"name": "ساندوتش حمسة حاشي جبن", "price": "6", "cat": "ساندوتشات الفطور"},
  {"name": "ساندوتش حمسة حاشي", "price": "6", "cat": "ساندوتشات الفطور"},
  {"name": "بيض مقلي جبن", "price": "3", "cat": "ساندوتشات الفطور"},
  {"name": "بيض مقلي سادة", "price": "3", "cat": "ساندوتشات الفطور"},
  {"name": "صاروخ كبدة جبن", "price": "12", "cat": "الصواريخ"},
  {"name": "صاروخ كبدة", "price": "12", "cat": "الصواريخ"},
  {"name": "صاروخ حمسة حاشي جبن", "price": "15", "cat": "الصواريخ"},
  {"name": "صاروخ حمسة حاشي", "price": "15", "cat": "الصواريخ"},
  {"name": "صحن كبدة", "price": "15", "cat": "الصحون"},
  {"name": "صحن حمسة لحم حاشي", "price": "20", "cat": "الصحون"},
  {"name": "شاهي", "price": "1", "cat": "المشروبات الساخنة"},
  {"name": "شاهي حليب", "price": "2", "cat": "المشروبات الساخنة"},
  {"name": "زنجبيل حليب", "price": "2", "cat": "المشروبات الساخنة"},
  {"name": "ببسي", "price": "3", "cat": "المشروبات"},
  {"name": "حمضيات", "price": "3", "cat": "المشروبات"},
  {"name": "ماء", "price": "1", "cat": "المشروبات"}
];

// نظام معالجة وحماية الحفظ المحلي
function safeGet(k, def) {
  try {
    const item = localStorage.getItem(k);
    return item ? JSON.parse(item) : def;
  } catch(e) { return def; }
}

function safeSet(k, val) {
  try { localStorage.setItem(k, JSON.stringify(val)); } catch(e) {}
}

let DB = safeGet('tk_db_safe', { items: DEF_ITEMS, orders: [], pw: 'NS1431', pin: '1209', w: '80' });
let CART = safeGet('tk_cart_safe', {});
let CI = safeGet('tk_ci_safe', { name: '', phone: '', type: 'من الفرع', when: 'الآن', plate: '', car: '', color: '' });

function saveAll() {
  safeSet('tk_db_safe', DB);
  safeSet('tk_cart_safe', CART);
  safeSet('tk_ci_safe', CI);
}

const $ = s => document.querySelector(s);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// عرض المنيو والتصنيفات
function renderMenu() {
  const q = ($('#q').value || '').trim();
  let g = {};
  DB.items.forEach(i => {
    if(q && !i.name.includes(q) && !i.cat.includes(q)) return;
    (g[i.cat] = g[i.cat] || []).push(i);
  });
  
  $('#menu').innerHTML = Object.keys(g).map(c => `
    <div class="cat">
      <h3>${esc(c)}</h3>
      ${g[c].map(i => `
        <div class="mi">
          <div><span class="n">${esc(i.name)}</span></div>
          <div>
            <span class="v">${esc(i.price)} ر.س </span>
            <button class="add" onclick="addCart('${esc(i.name)}','${esc(i.price)}')">+</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('') || '<p style="text-align:center;color:var(--mu);margin-top:20px">لا توجد نتائج متطابقة</p>';
}

function addCart(n, p) {
  CART[n] = CART[n] || { q: 0, p: parseFloat(p) };
  CART[n].q++;
  saveAll();
  updateCartBar();
}

function updateCartBar() {
  const cnt = Object.values(CART).reduce((s, x) => s + x.q, 0);
  const tot = Object.values(CART).reduce((s, x) => s + x.q * x.p, 0);
  const b = $('#cartbar');
  b.classList.toggle('on', cnt > 0);
  b.innerHTML = `<span>سلة الطلب (${cnt})</span><span>${tot} ر.س</span>`;
}

// محرك الاقتراحات الذكية (AI Upsell Engine)
function getAiUpsell() {
  const names = Object.keys(CART);
  if(!names.length) return '';
  const hasDrink = names.some(n => n.includes('شاهي') || n.includes('ببسي') || n.includes('ماء') || n.includes('زنجبيل'));
  if(!hasDrink) return '💡 <b>اقتراح المطبخ:</b> أضف (شاهي حليب) ليُكمل وجبتك الآن!';
  const hasFood = names.some(n => n.includes('كبدة') || n.includes('حاشي'));
  if(hasFood) return '🔥 <b>الزبائن يفضلون أيضاً:</b> إضافة صاروخ كبدة جبن مع طلبهم!';
  return '';
}

// عرض السلة والدفع
function renderCartModal() {
  const ks = Object.keys(CART);
  if(!ks.length){ $('#ord').classList.remove('on'); return; }
  const tot = ks.reduce((s, k) => s + CART[k].q * CART[k].p, 0);
  const ai = getAiUpsell();
  
  $('#cart').innerHTML = `
    <h3>تفاصيل طلبك</h3>
    ${ks.map(k => `
      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0;border-bottom:1px dotted var(--line);padding-bottom:6px">
        <b style="flex:1">${esc(k)} <small style="color:var(--mu)">(${CART[k].q * CART[k].p} ر.س)</small></b>
        <button class="add" onclick="modQ('${esc(k)}',-1)">-</button>
        <span style="margin:0 10px;font-weight:700">${CART[k].q}</span>
        <button class="add" onclick="modQ('${esc(k)}',1)">+</button>
      </div>
    `).join('')}
    ${ai ? `<div class="ai-box">${ai}</div>` : ''}
    
    <label style="margin-top:10px">طريقة الاستلام</label>
    <select id="cty" onchange="CI.type=this.value;saveAll();renderCartModal()">
      <option ${CI.type==='من الفرع'?'selected':''}>من الفرع</option>
      <option ${CI.type==='من السيارة'?'selected':''}>من السيارة</option>
    </select>
    
    ${CI.type==='من السيارة'?`
      <input placeholder="رقم اللوحة *" value="${esc(CI.plate)}" oninput="CI.plate=this.value;saveAll()">
      <input placeholder="نوع السيارة *" value="${esc(CI.car)}" oninput="CI.car=this.value;saveAll()">
      <input placeholder="لون السيارة *" value="${esc(CI.color)}" oninput="CI.color=this.value;saveAll()">
    `:''}
    
    <input placeholder="رقم الجوال * (05xxxxxxxx)" inputmode="tel" value="${esc(CI.phone)}" oninput="CI.phone=this.value;saveAll()">
    <input placeholder="الاسم (اختياري)" value="${esc(CI.name)}" oninput="CI.name=this.value;saveAll()">
    
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:19px;margin-top:12px;color:var(--ac2)">
      <span>المبلغ الإجمالي:</span><span>${tot} ر.س</span>
    </div>
    
    <button class="btn p" style="width:100%;margin-top:10px" onclick="sendOrder()">تأكيد وإرسال الطلب عبر واتساب</button>
    <button class="btn" style="width:100%;margin-top:6px" onclick="$('#ord').classList.remove('on')">إلغاء</button>
  `;
}

function modQ(k, d) {
  if(CART[k]) {
    CART[k].q += d;
    if(CART[k].q <= 0) delete CART[k];
  }
  saveAll();
  updateCartBar();
  renderCartModal();
}

function sendOrder() {
  if(!CI.phone || !/^05\d{8}$/.test(CI.phone.trim())) return alert('الرجاء كتابة رقم جوال سعودي صحيح (05xxxxxxxx)');
  if(CI.type==='من السيارة' && (!CI.plate.trim() || !CI.car.trim() || !CI.color.trim())) return alert('الرجاء تعبئة بيانات السيارة بالكامل');
  
  const ks = Object.keys(CART);
  const tot = ks.reduce((s, k) => s + CART[k].q * CART[k].p, 0);
  const ref = Math.floor(1000 + Math.random()*9000);
  
  const o = {
    r: ref,
    i: ks.map(k => [k, CART[k].q, CART[k].p]),
    tot,
    t: CI.type,
    n: CI.name,
    ph: CI.phone,
    p: CI.plate,
    c: CI.car,
    l: CI.color,
    ts: Date.now(),
    st: 'جديد'
  };
  
  DB.orders.push(o);
  
  // تجهيز رابط الواتساب
  const txt = 'السلام عليكم، طلب جديد #' + ref + '\n' +
    ks.map(k => `- ${k} × ${CART[k].q}`).join('\n') +
    `\nطريقة الاستلام: ${CI.type}` +
    (CI.name ? `\nالاسم: ${CI.name}` : '') +
    `\nالجوال: ${CI.phone}` +
    (CI.type==='من السيارة' ? `\nالسيارة: ${CI.car} - ${CI.color} (لوحة: ${CI.plate})` : '') +
    `\nالمجموع: ${tot} ر.س`;
  
  window.open('https://wa.me/966503236421?text=' + encodeURIComponent(txt), '_blank');
  
  // طباعة حرارية تلقائية
  localPrint(o);
  
  CART = {};
  saveAll();
  updateCartBar();
  $('#ord').classList.remove('on');
}

// محرك الطباعة الحرارية والمباشرة
function localPrint(o) {
  const p = $('#pa');
  p.style.setProperty('--pw', DB.w === '58' ? '48mm' : '72mm');
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=95x95&data=${encodeURIComponent('TopKabda-Order#'+o.r+'-Total:'+o.tot)}`;
  
  p.innerHTML = `
    <div class="rc">
      <div class="rh">
        <h2>بوفية توب كبدة</h2>
        <small>فاتورة إلكترونية مبسطة</small>
        <b>طلب رقم #${esc(o.r)}</b>
        <small>${new Date(o.ts).toLocaleString('ar-SA')}</small>
      </div>
      <div style="margin:4px 0">
        <div><b>طريقة الخدمة:</b> ${esc(o.t)}</div>
        ${o.n ? `<div><b>العميل:</b> ${esc(o.n)}</div>` : ''}
        ${o.ph ? `<div><b>الجوال:</b> ${esc(o.ph)}</div>` : ''}
        ${o.type === 'من السيارة' ? `<div><b>السيارة:</b> ${esc(o.c)} - ${esc(o.l)} (${esc(o.p)})</div>` : ''}
      </div>
      <div style="border-top:1px dashed #000;margin:4px 0"></div>
      ${o.i.map(x => `<div class="ritem"><span>${x[1]}× ${esc(x[0])}</span><b>${x[1] * x[2]} ر.س</b></div>`).join('')}
      <div class="rsum">
        <div style="display:flex;justify-content:space-between"><span>المبلغ المستحق:</span><span>${o.tot} ر.س</span></div>
      </div>
      <div class="rqr"><img src="${qrUrl}" alt="QR"></div>
    </div>
  `;
  setTimeout(() => window.print(), 300);
}

// شاشة ونظام الكاشير المباشر
let cashierLogged = false;
$('#opcash').onclick = () => {
  $('#capp').classList.add('on');
  if(!cashierLogged) {
    $('#capp').innerHTML = `
      <div style="max-width:340px;margin:18vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:24px;text-align:center">
        <h2>🧾 دخول الكاشير</h2>
        <input type="password" id="cpin" placeholder="الرمز السري (1209)" inputmode="numeric" style="margin:12px 0;text-align:center">
        <button class="btn p" style="width:100%" onclick="loginCashier()">دخول النظام</button>
        <button class="btn" style="width:100%;margin-top:8px" onclick="$('#capp').classList.remove('on')">إلغاء</button>
      </div>
    `;
  } else renderCashier();
};

function loginCashier() {
  const v = $('#cpin').value;
  if(v === DB.pin || v === '1209') { cashierLogged = true; renderCashier(); }
  else alert('كلمة مرور الكاشير غير صحيحة');
}

function renderCashier() {
  const ords = DB.orders.slice().reverse();
  $('#capp').innerHTML = `
    <div class="ch">
      <b>🧾 شاشة الكاشير والمبيعات المباشرة</b>
      <button class="btn" onclick="$('#capp').classList.remove('on')">خروج</button>
    </div>
    <div class="cb">
      <h3>سجل الطلبات الحالية (${ords.length})</h3>
      ${ords.map(o => `
        <div class="oc">
          <div style="display:flex;justify-content:space-between;font-size:18px"><b style="color:var(--ac2)">#${esc(o.r)} - ${esc(o.t)}</b><span>${o.tot} ر.س</span></div>
          <small style="color:var(--mu)">${new Date(o.ts).toLocaleString('ar-SA')}</small>
          <div style="margin:8px 0">${o.i.map(x => `${x[1]}× ${esc(x[0])}`).join(' ، ')}</div>
          <button class="btn p" style="padding:6px 14px;font-size:13px" onclick='localPrint(${JSON.stringify(o)})'>🖨 طباعة الفاتورة تلقائياً</button>
        </div>
      `).join('') || '<p style="color:var(--mu);text-align:center;margin-top:20px">لا توجد طلبات سابقة</p>'}
    </div>
  `;
}

// نظام لوحة تحكم المالك والإعدادات
$('#open').onclick = () => {
  const pw = prompt('أدخل كلمة السر الخاصة بالإعدادات (NS1431):');
  if(pw === DB.pw || pw === 'NS1431') {
    $('#panel').classList.add('on');
    $('#sheet').innerHTML = `
      <h2>⚙ الإعدادات ولائحة التحكم</h2>
      <p style="color:var(--mu)">تم تحديث وتفعيل نظام التخزين المحمي والأمن ضد فقدان البيانات.</p>
      
      <label>قياس عرض الورق للطابعة الحرارية</label>
      <select id="prw" onchange="DB.w=this.value;saveAll()">
        <option value="80" ${DB.w!=='58'?'selected':''}>80 مم (قياسي)</option>
        <option value="58" ${DB.w==='58'?'selected':''}>58 مم (صغير)</option>
      </select>
      
      <button class="btn p" style="width:100%;margin-top:20px" onclick="saveAll();$('#panel').classList.remove('on')">حفظ وإغلاق</button>
    `;
  } else alert('كلمة السر غير صحيحة!');
};

$('#cartbar').onclick = () => { renderCartModal(); $('#ord').classList.add('on'); };
$('#q').oninput = renderMenu;

// التحديث الخلفي التلقائي المستمر كل 60 ثانية (دقيقة)
setInterval(() => {
  saveAll();
  if(cashierLogged && $('#capp').classList.contains('on')) {
    renderCashier();
  }
}, 60000);

// بدء تشغيل البرنامج بالكامل
updateCartBar();
renderMenu();
</script>
</body>
</html>
